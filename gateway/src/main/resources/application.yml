server:
  port: 9000
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          # 启动网关的路由功能,允许进行路由配置
          enabled: true
          # 允许服务器名小写
          lower-case-service-id: true
      routes:  #开始路由配置
        - id: gateway-search
          uri: lb://search-service
          predicates:
            - Path=/v3/**
        - id: gateway-auth
          uri: lb://auth-service
          predicates:
            - Path=/oauth/**
        - id: gateway-faq
          uri: lb://faq-service
          predicates:
            - Path=/v2/**
        - id: gateway-sys
          uri: lb://sys-service
          predicates:
            - Path=/v1/**
        - id: gateway-resource # 设置路由名称,和其它任何配置无关
          # 配置路由目标服务器的名称resource-server
          # 必须和nacos中注册的服务器名称一致
          # lb:Load Balance的缩写,意思是负载均衡
          uri: lb://resource-server
          # 下面来定义路由特征:"什么样的路径是访问静态资源服务器的?"
          # 下面的定义就是一个通配,凡是满足通配的就是访问静态资源服务器的
          predicates:
            - Path=/image/**
          # 经过了上面的配置效果为:
          # 当访问localhost:9000/image/a.jpg时
          # 相当于访问了静态资源服务器的同路径资源:
          # localhost:8899/image/a.jpg






